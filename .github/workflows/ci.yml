name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Balance sweep is byte-identical
        run: npm run test:sweep
      - name: Watch bundle is up to date
        run: |
          npm run build:watch
          git diff --exit-code --stat js/watch/bundle.js || (echo "::error::js/watch/bundle.js is stale — run npm run build:watch and commit it"; exit 1)
      - name: Release consistency (version, cache, notes, precache list)
        run: node tools/release.mjs --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (phone + watch, real server)
        run: npm run test:smoke
      - name: Black-patch scan (Ultra renderer, software WebGL)
        run: node tests/perf/gl-scan.mjs --frames 8
      - name: QA bot (onboarding, Ultimate XI, career season, weekend, online 2-client, watch)
        run: npm run test:qa
      - name: Camera regression shots (every preset and set-piece angle, two grounds)
        run: node tests/visual/camera-shots.mjs --venues forge,bramble
      - name: Small-phone and right-to-left layout scan
        run: node tests/visual/layout-scan.mjs
      - name: Upload camera and layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: |
            tests/tmp/shots/
            tests/tmp/layout/
          if-no-files-found: ignore
          retention-days: 14
