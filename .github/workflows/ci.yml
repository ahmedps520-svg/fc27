name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 65   # v97: ~41 min with the attract step; 40 cut the soak off. v113: ~48 min by v112, and the evo audit doubled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Balance sweep is byte-identical
        run: npm run test:sweep
      - name: Economy — no repeatable SBC pays for itself
        run: node tools/sbc-audit.mjs
      - name: Economy — every evolution track can be finished
        run: node tools/evo-audit.mjs
      - name: Watch bundle is up to date
        run: |
          npm run build:watch
          git diff --exit-code --stat js/watch/bundle.js || (echo "::error::js/watch/bundle.js is stale — run npm run build:watch and commit it"; exit 1)
      - name: Release consistency (version, cache, notes, precache list)
        run: node tools/release.mjs --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (phone + watch, real server)
        run: npm run test:smoke
      - name: Black-patch scan (Ultra renderer, software WebGL)
        run: node tests/perf/gl-scan.mjs --frames 8
      - name: QA bot (onboarding, Ultimate XI, career season, weekend, online 2-client, watch)
        run: npm run test:qa
      - name: Camera regression shots (every preset and set-piece angle, two grounds)
        run: node tests/visual/camera-shots.mjs --venues forge,bramble
      - name: Small-phone and right-to-left layout scan
        run: node tests/visual/layout-scan.mjs
      - name: Accessibility scan (names, focus rings, keyboard)
        run: node tests/visual/a11y-scan.mjs
      - name: Touch pad on four phones (sizes, gaps, reach, nothing covered)
        run: node tools/touch-audit.mjs
      - name: Touch button editor and flicks (drag, size, saved into the match, chip/finesse/through by flick, reset)
        run: node tests/qa/touch-editor.mjs
      - name: Controller only (every screen by pad, keyboard, tabs, sliders, line-up)
        run: node tests/qa/pad-reach.mjs
      - name: A real controller (not in slot 0, raw Xbox and PlayStation layouts) drives the menus
        run: node tests/qa/pad-real.mjs
      - name: Custom Cup end to end (make, draw, play a tie, bracket) and Kick Off on a revisit
        run: node tests/qa/cup.mjs
      - name: SBCs (every group unfolds, Start opens a challenge in each)
        run: node tests/qa/sbc.mjs
      - name: Ultimate shop (test-mode checkout, receipt, store email in the outbox, balance untouched)
        run: node tests/qa/shop.mjs
      - name: Offline play (service worker)
        run: node tests/qa/offline.mjs
      - name: Attract demo (idle title plays itself; any input leaves; nothing paid)
        run: node tests/qa/attract.mjs
      - name: Soak (20 matches, random modes and settings)
        run: node tests/qa/soak.mjs --matches 20
      - name: Upload camera and layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: |
            tests/tmp/shots/
            tests/tmp/layout/
          if-no-files-found: ignore
          retention-days: 14
