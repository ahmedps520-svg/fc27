# v188: put the App Store listing in app/store/ onto App Store Connect.
#
# Actions → "iOS → App Store listing" → Run workflow. Applies app/store/listing.json
# (description, keywords, subtitle, links, copyright, category, age rating,
# content rights, free price, availability, notes for App Review) and replaces
# the screenshots with app/store/screenshots/. Safe to run again after editing
# those files. App Privacy and the App Review contact are left for you to fill
# in on the website. Then run "iOS → App Store review" to submit.
name: iOS → App Store listing

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App Store version (e.g. 1.0)'
        required: true
        default: '1.0'

concurrency:
  group: ios-review
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'online.apexxi.game' }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: API key (cleaned and checked)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          clean() { printf '%s' "$1" | tr -d ' \t\r\n"'"'"; }
          KEY_ID="$(clean "$ASC_KEY_ID")"; ISSUER_ID="$(clean "$ASC_ISSUER_ID")"
          bad=0
          [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error title=ASC_KEY_ID::should be the 10-character Key ID"; bad=1; }
          [[ "$ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error title=ASC_ISSUER_ID::should be the Issuer ID"; bad=1; }
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::version must look like 1.0 or 1.0.1"; bad=1; }
          [ $bad = 0 ] || exit 1
          echo "::add-mask::$KEY_ID"; echo "::add-mask::$ISSUER_ID"
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          bash app/ci/asc-key.sh "$KEY_PATH"
          { echo "KEY_ID=$KEY_ID"; echo "ISSUER_ID=$ISSUER_ID"; echo "KEY_PATH=$KEY_PATH"; } >> "$GITHUB_ENV"

      - name: Apply the listing
        run: node app/ci/asc-listing.mjs --bundle "$BUNDLE_ID" --version "$VERSION"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
