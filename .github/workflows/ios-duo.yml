# v208: the App Store app in Xcode's iPhone Duo simulator, folded and unfolded.
#
# Builds the iOS app for the simulator with the tour (app/ci/duo-tour.js: the app walks
# itself through the menu, the squad, the store, Today, Career, Settings and a match),
# boots an iPhone Duo, and photographs each stop. The screenshots and the log (the size
# the web view was given, its safe-area insets, anything drawn off screen) are the run's
# artifact "iphone-duo". Nothing is signed or uploaded.
name: iOS → iPhone Duo check

on:
  workflow_dispatch:
    inputs:
      poses:
        description: 'Poses to photograph (space separated: folded unfolded)'
        default: 'folded unfolded'

concurrency:
  group: ios-duo
  cancel-in-progress: true

jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc' | sort -V | tail -1)"
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: What the simulator offers
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -iE 'duo|fold|iphone' || true
          echo '--- simctl commands'; xcrun simctl help 2>&1 | sed -n '1,80p'
          echo '--- io'; xcrun simctl io 2>&1 | sed -n '1,60p' || true
          echo '--- any posture/fold commands'; xcrun simctl help 2>&1 | grep -iE 'pose|posture|fold|hinge|display' || echo none

      - name: Build the web files with the tour, and the app for the simulator
        working-directory: app
        env:
          APEX_TOUR: '1'
          APEX_IOS_VERSION: '1.5'
          APEX_IOS_BUILD: ${{ github.run_number }}
          APEX_IOS_COMMIT: ${{ github.sha }}
        run: |
          npm ci
          node build-www.mjs
          npx cap sync ios
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO | tail -n 25
          APP="$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)"
          test -d "$APP" || { echo "::error::no .app built"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Boot an iPhone Duo
        timeout-minutes: 15
        run: |
          DT="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=[x for x in json.load(sys.stdin)["devicetypes"] if "duo" in x["name"].lower()]; print(d[0]["identifier"] if d else "")')"
          test -n "$DT" || { echo "::error::no iPhone Duo simulator in this Xcode"; exit 1; }
          # the newest iOS runtime that can run an iPhone Duo (iOS 27.2 for every iPhone says "Incompatible device")
          export DT
          RT="$(xcrun simctl list runtimes -j | python3 -c 'import json,os,sys; dt=os.environ["DT"]; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"] and any(t.get("identifier")==dt for t in x.get("supportedDeviceTypes",[]))]; r.sort(key=lambda x: [int(p) for p in x["version"].split(".")]); print(r[-1]["identifier"] if r else "")')"
          echo "runtime $RT · device type $DT"
          test -n "$RT" || { echo "::error::no iOS runtime here can run $DT"; exit 1; }
          UDID="$(xcrun simctl create duo "$DT" "$RT")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo '--- its screens'; xcrun simctl io "$UDID" enumerate 2>&1 | sed -n '1,120p' | tee "$RUNNER_TEMP/screens.txt"

      - name: Photograph the tour
        # its own limit, below the job's: a job that runs out of time is cancelled and GitHub keeps
        # neither its log nor its upload, so this step must end first, and the upload still runs
        timeout-minutes: 30
        env:
          POSES: ${{ inputs.poses }}
        run: |
          OUT="$RUNNER_TEMP/duo"; mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          # every simulator command under its own short limit (macOS has no timeout(1))
          t() { local s="$1"; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          t 120 xcrun simctl install "$UDID" "$APP"
          BID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          # The Duo has two built-in screens (plus a TV-out) and no fold command: a pose is which one
          # is powered. From `io enumerate`: the first built-in screen is the outer display, the
          # second the inner one (their pictures' sizes say so: 2034 × 1398 and 2853 × 2007).
          SCR="$(awk '/Screen ID:/{id=$3} /Screen Type:/{if ($3=="Integrated") print id}' "$RUNNER_TEMP/screens.txt" | tr '\n' ' ')"
          OUTER="$(echo $SCR | cut -d' ' -f1)"; INNER="$(echo $SCR | cut -d' ' -f2)"
          [ -n "$OUTER" ] || OUTER=1; [ -n "$INNER" ] || INNER=3
          echo "outer display $OUTER, inner display $INNER"
          shoot() { for D in $OUTER $INNER; do t 30 xcrun simctl io "$UDID" screenshot --type=jpeg --display="$D" --mask=black "$OUT/$1-d$D.jpg" >/dev/null 2>&1 && echo "  $1 display $D ✓" || echo "  $1 display $D: no picture"; done; }
          # the tour's timetable (app/ci/duo-tour.js: stop k from 25·k s after the page loads), in seconds after launch
          STOPS="probe:16 title:38 menu:66 squad:90 store:115 today:140 settings:165 match:270 match2:305 pause:345"
          for POSE in $POSES; do
            if [ "$POSE" = unfolded ]; then ON=$INNER; OFF=$OUTER; else ON=$OUTER; OFF=$INNER; fi
            t 20 xcrun simctl io "$UDID" screenConfig --display="$ON" power on 2>&1 | head -3 || true
            t 20 xcrun simctl io "$UDID" screenConfig --display="$OFF" power off 2>&1 | head -3 || true
            sleep 5
            t 20 xcrun simctl io "$UDID" enumerate > "$OUT/$POSE-screens.txt" 2>&1 || true
            t 30 xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            perl -e 'alarm shift; exec @ARGV' 600 xcrun simctl launch --terminate-running-process --stdout="$OUT/$POSE.out" --stderr="$OUT/$POSE.err" "$UDID" "$BID" &
            LAUNCH=$!
            L0=$(date +%s)
            echo "$POSE: display $ON on, $OFF off; launched at $(date -u +%T)"
            for S in $STOPS; do
              NAME="${S%%:*}"; AT="${S##*:}"; NOW=$(( $(date +%s) - L0 ))
              [ "$NOW" -lt "$AT" ] && sleep $(( AT - NOW ))
              echo "$POSE $NAME at $(( $(date +%s) - L0 )) s"; shoot "$POSE-$NAME"
            done
            t 30 xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            kill "$LAUNCH" 2>/dev/null || true; wait "$LAUNCH" 2>/dev/null || true
          done
          ls -la "$OUT"

      - name: Keep the logs short
        if: always()
        timeout-minutes: 2
        run: |
          cd "$RUNNER_TEMP/duo" 2>/dev/null || exit 0
          for f in *.out *.err; do [ -f "$f" ] && head -n 400 "$f" > "$f.txt"; done
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 10
        with:
          name: iphone-duo
          # pictures and short text only, each text file cut to its first 400 lines
          path: |
            ${{ runner.temp }}/duo/*.jpg
            ${{ runner.temp }}/duo/*.txt
          if-no-files-found: warn
