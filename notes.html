<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070e" />
  <title>Release Notes — APEX XI</title>
  <meta name="description" content="What changed in APEX XI, build by build." />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<!--
  The long version of what the in-game card summarises.

  Both are built from js/data/patchNotes.js, so there is exactly one copy of the
  text and an update cannot ship with a card that says one thing and a page that
  says another. This page is plain and static on purpose: it is the thing people
  land on from a link, sometimes on a phone, sometimes offline, and it should
  never need the game to have booted.
-->
<body class="notes-page">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-orb one" aria-hidden="true"></div>
  <div class="bg-orb two" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="APEX XI home">
      <span class="brand-mark">XI</span>
      <span>APEX XI</span>
    </a>
    <span class="wallet">
      <a class="np-back" href="index.html">Back to the game</a>
    </span>
  </header>

  <main class="screen" id="notesRoot">
    <p class="empty">Loading release notes…</p>
  </main>

  <script type="module">
    import { RELEASES } from './js/data/patchNotes.js';

    const fmtDate = (iso) => {
      const d = new Date(`${iso}T00:00:00`);
      return Number.isNaN(d.getTime()) ? iso
        : d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
    };

    const article = (rel, i) => `
      <article class="rn" id="${rel.version}">
        <header class="rn-head">
          <div class="rn-meta">
            <span class="np-tag">${rel.tag}</span>
            <span class="np-ver">${rel.version}</span>
            <time datetime="${rel.date}">${fmtDate(rel.date)}</time>
            ${i === 0 ? '<span class="rn-latest">Latest</span>' : ''}
          </div>
          <h2>${rel.title}</h2>
          <p class="rn-lede">${rel.lede}</p>
        </header>
        ${rel.entries.map((e) => `
          <section class="rn-entry">
            <h3>${e.head}</h3>
            <p class="rn-sum">${e.summary}</p>
            <p class="rn-detail">${e.detail}</p>
          </section>`).join('')}
      </article>`;

    document.getElementById('notesRoot').innerHTML = `
      <header class="screen-head tone-a rn-hero">
        <svg class="sh-swoosh" viewBox="0 0 300 190" preserveAspectRatio="none" aria-hidden="true">
          <path class="ts-a" d="M120 200 L182 196 L312 34" />
          <path class="ts-b" d="M150 202 L206 200 L312 74" />
        </svg>
        <p class="sh-kicker">Release notes</p>
        <h1 class="sh-title">What's new</h1>
        <p class="sh-sub">Every change to APEX XI, newest first — what it does, and why it changed.</p>
      </header>
      <nav class="rn-index">
        ${RELEASES.map((r) => `<a href="#${r.version}">${r.version}</a>`).join('')}
      </nav>
      ${RELEASES.map(article).join('')}
      <p class="disclaimer">Clubs, leagues and competitions are fictional. Player names
        and nationalities are those of real footballers, used without endorsement or
        affiliation. Portraits are drawn and are not likenesses.</p>`;

    // arriving on notes.html#v23 should land on that release, not the top
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  </script>
</body>
</html>
