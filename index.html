<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- user-scalable=no stops iOS double-tap zoom fighting the on-screen stick -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070e" />
  <title>APEX XI — Football Club Manager</title>
  <meta name="description" content="APEX XI: an original football card-collecting and management game with fictional clubs, players and leagues." />

  <!-- installable app -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="APEX XI" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />

  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-orb one" aria-hidden="true"></div>
  <div class="bg-orb two" aria-hidden="true"></div>

  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back to main menu" hidden>‹</button>
    <button id="homeBtn" class="brand" aria-label="APEX XI home">
      <span class="brand-mark">XI</span>
      <span id="topTitle">APEX XI</span>
    </button>
    <span class="coin-chip top"><i>◈</i> <span id="coins">0</span></span>
  </header>

  <main id="screen" class="screen"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div class="rotate-hint" id="rotateHint" hidden>
    <span class="rh-phone">▭</span>
    <b>Rotate your device</b>
    <span>APEX XI plays in landscape</span>
  </div>

  <!-- the vendored three.js addons import a bare "three" specifier -->
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three.module.js" } }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
