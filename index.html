<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a12" />
  <title>APEX XI — Football Club Manager</title>
  <meta name="description" content="APEX XI: an original football card-collecting and management game with fictional clubs, players and leagues." />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23070a12'/><text x='50' y='68' font-size='54' font-weight='900' text-anchor='middle' fill='%2341d3ff'>XI</text></svg>" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-orb one" aria-hidden="true"></div>
  <div class="bg-orb two" aria-hidden="true"></div>

  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Back to main menu" hidden>‹</button>
    <button id="homeBtn" class="brand" aria-label="APEX XI home">
      <span class="brand-mark">XI</span>
      <span id="topTitle">APEX XI</span>
    </button>
    <span class="coin-chip top"><i>◈</i> <span id="coins">0</span></span>
  </header>

  <main id="screen" class="screen"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
